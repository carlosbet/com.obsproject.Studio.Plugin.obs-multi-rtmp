id: com.obsproject.Studio.Plugin.obs-multi-rtmp
branch: stable
runtime: com.obsproject.Studio
runtime-version: stable
sdk: org.kde.Sdk//6.6
build-extension: true
separate-locales: false
appstream-compose: false
build-options:
  prefix: /app/plugins/obs-multi-rtmp
modules:
  - name: obs-multi-rtmp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON      
      - -DENABLE_FRONTEND_API=ON      
      - -DENABLE_QT=ON      
      - -DCMAKE_CXX_STANDARD=20
      - -DCMAKE_CXX_STANDARD_REQUIRED=ON
      - -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF
    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo ../${FLATPAK_ID}.metainfo.xml
      - appstream-compose --basename=${FLATPAK_ID} --prefix=${FLATPAK_DEST} --origin=flatpak
        ${FLATPAK_ID}
    sources:
      - type: git
        url: https://github.com/carlosbet/obs-multi-rtmp.git
        tag: v0.6.1
        commit: 2811dc63e61f702125ec5b6c3dad19698e0d8c84
      - type: file
        path: com.obsproject.Studio.Plugin.obs-multi-rtmp.metainfo.xml